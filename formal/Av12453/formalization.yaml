version: "v0.4"

project:
  name: "Counting recurrences for the permutation classes Av(1342) and Av(12453)"
  description: >-
    For a permutation pattern τ, let Av_n(τ) be the set of permutations of
    length n that avoid τ.  This formalization proves, for every n, that four
    recurrences from the source paper compute |Av_n(1342)| and |Av_n(12453)|.
    For 1342 they are the one-threshold recurrence W and the scalar kernel
    recurrence G, and for 12453 the literal two-threshold recurrence H and the
    transfer-kernel recurrence G.  These are the cases d = 1 and d = 2 of the
    paper's counting recurrences for the classes Av(12...d ⊕ 231), the direct
    sum of an increasing pattern and 231, whose kernel form gives
    polynomial-time algorithms for every fixed d (the complexity bounds
    themselves are not formalized).  The counting sequence of Av(1342) has been
    known since Bóna (1997).  That of Av(12453) was previously known only up to
    n = 38, from a program of Biers-Ariel that evaluates the recurrence H, and
    the paper uses its kernel algorithm to compute it up to n = 150 (that
    computation is not formalized).
  authors:
    - "Henning Arnór Skeggi Úlfarsson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Henning Arnór Skeggi Úlfarsson"

